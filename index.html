<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zebra-rs — Routing Software in the AI Era</title>
  <link rel="stylesheet" href="assets/fonts.css" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="icon" type="image/svg+xml" href="assets/zebra-logo.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  <script type="text/javascript" src="sha256.js"></script>
</head>
<body>
      <form id="form">
      <p id="message">Please enter your password.</p>
      <input type="password" placeholder="password" id="password">
    </form>
    <script>
     function hash(text) {
       const sha = new jsSHA('SHA-256', 'TEXT');
       sha.update(text);
       return sha.getHash('HEX');
     }
     function auth(password) {
       const url = hash(password);
       const xhr = new XMLHttpRequest();
       xhr.open('GET', url);
       xhr.send();
       xhr.onload = function () {
         if (xhr.readyState === 4 && xhr.status === 200) {
           window.location = url;
         } else {
           const message = document.getElementById('message');
           const input = document.getElementById('password');
           message.innerHTML = 'Wrong password! Try again.';
           input.value = '';
         }
       };
       xhr.onerror = function () {
         const message = document.getElementById('message');
         message.innerHTML = 'Sorry, ERROR !';
       };
     }
     const form = document.getElementById('form');
     form.addEventListener('submit', function (event) {
       const password = document.getElementById('password').value;
       auth(password);
       event.preventDefault();
     });
    </script>
</body>
</html>
