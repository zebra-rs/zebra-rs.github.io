<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS-IS Topology Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #graph-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            display: block;
        }

        .node circle {
            fill: #4a90d9;
            stroke: #2c5aa0;
            stroke-width: 2px;
            cursor: grab;
        }

        .node circle:hover {
            fill: #5ba0e9;
            stroke: #3c6ab0;
        }

        .node text {
            font-size: 12px;
            font-weight: 600;
            fill: #ffffff;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .link {
            stroke: #ff8c42;
            stroke-width: 3px;
            stroke-linecap: round;
        }

        .metric-label {
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .metric-symmetric {
            fill: #4ade80;
        }

        .metric-asymmetric {
            fill: #ef4444;
        }

        #controls {
            background: rgba(30, 41, 59, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-btn {
            background: #4a90d9;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: #5ba0e9;
        }

        .toggle-btn.active {
            background: #22c55e;
        }

        .toggle-btn.inactive {
            background: #6b7280;
        }

        #level-select {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #e2e8f0;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .legend-color.symmetric {
            background: #4ade80;
        }

        .legend-color.asymmetric {
            background: #ef4444;
        }

        .legend-color.node {
            background: #4a90d9;
            border-radius: 50%;
        }

        .legend-color.link {
            background: #ff8c42;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="graph-container">
        <h1>IS-IS L2 Topology</h1>
        <svg id="topology"></svg>
    </div>
    
    <div id="controls">
        <div class="control-group">
            <label>Node Labels:</label>
            <button id="toggle-node-labels" class="toggle-btn active">ON</button>
        </div>
        <div class="control-group">
            <label>Metric Labels:</label>
            <button id="toggle-metric-labels" class="toggle-btn active">ON</button>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color node"></div>
                <span>Node</span>
            </div>
            <div class="legend-item">
                <div class="legend-color link"></div>
                <span>Link</span>
            </div>
            <div class="legend-item">
                <div class="legend-color symmetric"></div>
                <span>Symmetric Metric</span>
            </div>
            <div class="legend-item">
                <div class="legend-color asymmetric"></div>
                <span>Asymmetric Metric</span>
            </div>
        </div>
    </div>

    <script>
        // IS-IS Graph Data
        const isisData = {
            "level": "L2",
            "nodes": [
                {"id": 0, "name": "n1", "sys_id": "0000.0000.0002"},
                {"id": 1, "name": "s", "sys_id": "0000.0000.0001"},
                {"id": 2, "name": "n2", "sys_id": "0000.0000.0003"},
                {"id": 3, "name": "n3", "sys_id": "0000.0000.0004"},
                {"id": 4, "name": "r1", "sys_id": "0000.0000.0005"},
                {"id": 5, "name": "r2", "sys_id": "0000.0000.0006"},
                {"id": 6, "name": "d", "sys_id": "0000.0000.0008"},
                {"id": 7, "name": "r3", "sys_id": "0000.0000.0007"}
            ],
            "links_raw": [
                {"from": 0, "to": 1, "cost": 10},
                {"from": 0, "to": 4, "cost": 10},
                {"from": 0, "to": 5, "cost": 1},
                {"from": 0, "to": 6, "cost": 1},
                {"from": 1, "to": 0, "cost": 1},
                {"from": 1, "to": 2, "cost": 10},
                {"from": 1, "to": 3, "cost": 1000},
                {"from": 2, "to": 1, "cost": 10},
                {"from": 2, "to": 4, "cost": 10},
                {"from": 3, "to": 1, "cost": 1000},
                {"from": 3, "to": 4, "cost": 1000},
                {"from": 4, "to": 0, "cost": 10},
                {"from": 4, "to": 2, "cost": 10},
                {"from": 4, "to": 3, "cost": 1000},
                {"from": 4, "to": 5, "cost": 1000},
                {"from": 5, "to": 0, "cost": 1},
                {"from": 5, "to": 4, "cost": 1000},
                {"from": 5, "to": 7, "cost": 1000},
                {"from": 6, "to": 0, "cost": 1},
                {"from": 6, "to": 7, "cost": 1},
                {"from": 7, "to": 5, "cost": 1000},
                {"from": 7, "to": 6, "cost": 1}
            ]
        };

        // Process links to create bidirectional pairs
        function processLinks(linksRaw) {
            const linkMap = new Map();
            
            linksRaw.forEach(link => {
                const key = Math.min(link.from, link.to) + '-' + Math.max(link.from, link.to);
                if (!linkMap.has(key)) {
                    linkMap.set(key, {
                        source: link.from,
                        target: link.to,
                        costForward: null,
                        costReverse: null
                    });
                }
                
                const entry = linkMap.get(key);
                if (link.from < link.to) {
                    entry.costForward = link.cost;
                } else {
                    entry.costReverse = link.cost;
                }
            });

            return Array.from(linkMap.values()).map(link => ({
                source: link.source,
                target: link.target,
                costForward: link.costForward,
                costReverse: link.costReverse,
                isSymmetric: link.costForward === link.costReverse
            }));
        }

        const nodes = isisData.nodes.map(n => ({...n}));
        const links = processLinks(isisData.links_raw);

        // Setup SVG
        const container = document.getElementById('graph-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select('#topology')
            .attr('width', width)
            .attr('height', height);

        // Create arrow marker (not used but kept for potential future use)
        svg.append('defs').append('marker')
            .attr('id', 'arrowhead')
            .attr('viewBox', '-0 -5 10 10')
            .attr('refX', 20)
            .attr('refY', 0)
            .attr('orient', 'auto')
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .append('path')
            .attr('d', 'M 0,-5 L 10,0 L 0,5')
            .attr('fill', '#ff8c42');

        // Create force simulation
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-800))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(50));

        // Create links
        const link = svg.append('g')
            .attr('class', 'links')
            .selectAll('line')
            .data(links)
            .enter()
            .append('line')
            .attr('class', 'link');

        // Create metric labels group
        const metricLabels = svg.append('g')
            .attr('class', 'metric-labels');

        // Create metric label pairs for each link
        const metricGroups = metricLabels.selectAll('g')
            .data(links)
            .enter()
            .append('g')
            .attr('class', 'metric-group');

        // Forward metric (source -> target)
        metricGroups.append('text')
            .attr('class', d => `metric-label ${d.isSymmetric ? 'metric-symmetric' : 'metric-asymmetric'}`)
            .attr('data-type', 'forward')
            .text(d => d.costForward !== null ? d.costForward : '');

        // Reverse metric (target -> source)
        metricGroups.append('text')
            .attr('class', d => `metric-label ${d.isSymmetric ? 'metric-symmetric' : 'metric-asymmetric'}`)
            .attr('data-type', 'reverse')
            .text(d => d.costReverse !== null ? d.costReverse : '');

        // Create nodes
        const node = svg.append('g')
            .attr('class', 'nodes')
            .selectAll('g')
            .data(nodes)
            .enter()
            .append('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        node.append('circle')
            .attr('r', 25);

        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', 5)
            .text(d => d.name);

        // Update positions on tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);

            // Update metric label positions
            metricGroups.each(function(d) {
                const group = d3.select(this);
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const angle = Math.atan2(dy, dx);
                
                // Calculate perpendicular offset
                const offsetDist = 12;
                const perpX = -Math.sin(angle) * offsetDist;
                const perpY = Math.cos(angle) * offsetDist;
                
                // Position at 1/3 and 2/3 of the link
                const midX = (d.source.x + d.target.x) / 2;
                const midY = (d.source.y + d.target.y) / 2;
                
                const pos1X = d.source.x + dx * 0.35;
                const pos1Y = d.source.y + dy * 0.35;
                const pos2X = d.source.x + dx * 0.65;
                const pos2Y = d.source.y + dy * 0.65;

                group.select('[data-type="forward"]')
                    .attr('x', pos1X + perpX)
                    .attr('y', pos1Y + perpY)
                    .attr('text-anchor', 'middle')
                    .attr('dominant-baseline', 'middle');

                group.select('[data-type="reverse"]')
                    .attr('x', pos2X + perpX)
                    .attr('y', pos2Y + perpY)
                    .attr('text-anchor', 'middle')
                    .attr('dominant-baseline', 'middle');
            });
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Toggle controls
        let nodeLabelsVisible = true;
        let metricLabelsVisible = true;

        document.getElementById('toggle-node-labels').addEventListener('click', function() {
            nodeLabelsVisible = !nodeLabelsVisible;
            d3.selectAll('.node-label').style('opacity', nodeLabelsVisible ? 1 : 0);
            this.textContent = nodeLabelsVisible ? 'ON' : 'OFF';
            this.classList.toggle('active', nodeLabelsVisible);
            this.classList.toggle('inactive', !nodeLabelsVisible);
        });

        document.getElementById('toggle-metric-labels').addEventListener('click', function() {
            metricLabelsVisible = !metricLabelsVisible;
            d3.selectAll('.metric-label').style('opacity', metricLabelsVisible ? 1 : 0);
            this.textContent = metricLabelsVisible ? 'ON' : 'OFF';
            this.classList.toggle('active', metricLabelsVisible);
            this.classList.toggle('inactive', !metricLabelsVisible);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            svg.attr('width', newWidth).attr('height', newHeight);
            simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
            simulation.alpha(0.3).restart();
        });
    </script>
</body>
</html>
